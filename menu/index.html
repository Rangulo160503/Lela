<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3D2B1F" />
  <meta name="description" content="Panadería Lela — pan y repostería del día." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Panadería Lela</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/menu/menu.css?v=2" />
</head>
<body>
  <header class="hero">
    <div class="hero__media" aria-hidden="true">
      <img class="hero__photo" src="/images/hero-bakery.jpg" alt="" />
      <div class="hero__veil"></div>
    </div>
    <div class="hero__copy">
      <p class="hero__eyebrow">Desde el horno</p>
      <h1 class="hero__brand">Panadería Lela</h1>
      <p class="hero__lede">El sabor de cada día, listo para servir.</p>
    </div>
  </header>

  <div class="search-bar" role="search">
    <label class="search-bar__label visually-hidden" for="menu-search">Buscar producto</label>
    <div class="search-bar__field">
      <svg class="search-bar__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5" stroke-linecap="round"></path>
      </svg>
      <input
        id="menu-search"
        class="search-bar__input"
        type="search"
        placeholder="Buscar pan, concha, café…"
        autocomplete="off"
        enterkeyhint="search"
        disabled
      />
      <button type="button" id="menu-search-clear" class="search-bar__clear" hidden aria-label="Borrar búsqueda">
        ×
      </button>
    </div>
  </div>

  <main class="shelf">
    <header class="shelf__head">
      <h2 class="shelf__title">Nuestro pan y repostería</h2>
      <p class="shelf__hint">Precios en colones. Sujeto a disponibilidad del día.</p>
      <p id="search-meta" class="shelf__meta" hidden></p>
    </header>
    <p id="status" class="shelf__status" role="status">Cargando…</p>
    <div id="grid" class="grid" hidden></div>
  </main>

  <footer class="foot">
    <p class="foot__brand">Panadería Lela</p>
  </footer>

  <script src="/menu/menu.js?v=2"></script>
</body>
</html>
