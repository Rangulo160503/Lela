<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#3D2B1F" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Panadería Lela</title>
  <link rel="icon" href="/favicon.svg" />
  <!-- Solo lite.css: lela-ds (grid/gap/clamp) rompe el layout en iOS 9 -->
  <link rel="stylesheet" href="/lite/lite.css?v=38" />
</head>
<body>
  <div id="toast-host" aria-live="polite"></div>
  <div id="confirm-host"></div>

  <div id="view-login" class="login-editorial">
    <section class="login-editorial__panel">
      <div class="login-editorial__form-wrap">
        <div class="login-editorial__brand">
          <svg class="brand-mark" width="44" height="44" viewBox="0 0 40 48" fill="none" aria-hidden="true">
            <g fill="currentColor">
              <rect x="18.25" y="20" width="3.5" height="26" rx="0.5"></rect>
              <path d="M20 2.5 L16.5 11.5 L20 10 L23.5 11.5 Z"></path>
              <path d="M18.5 11.5 C12 9.5 8.5 13.5 10.5 17.5 C14.5 19 18.5 16.5 18.5 11.5 Z"></path>
              <path d="M21.5 11.5 C28 9.5 31.5 13.5 29.5 17.5 C25.5 19 21.5 16.5 21.5 11.5 Z"></path>
              <path d="M18.5 17 C11.5 15.5 7.5 20 10 24.5 C14.5 26 18.5 22.5 18.5 17 Z"></path>
              <path d="M21.5 17 C28.5 15.5 32.5 20 30 24.5 C25.5 26 21.5 22.5 21.5 17 Z"></path>
              <path d="M18.5 23 C12 22 8 26.5 11 31 C15.5 32 18.5 28 18.5 23 Z"></path>
              <path d="M21.5 23 C28 22 32 26.5 29 31 C24.5 32 21.5 28 21.5 23 Z"></path>
              <path d="M18.5 29.5 C13 29 10 33 12.5 36.5 C16 37 18.5 34 18.5 29.5 Z"></path>
              <path d="M21.5 29.5 C27 29 30 33 27.5 36.5 C24 37 21.5 34 21.5 29.5 Z"></path>
            </g>
          </svg>
          <div>
            <p class="login-editorial__kicker">Acceso al sistema</p>
            <h2 class="login-editorial__title">Bienvenido</h2>
          </div>
        </div>
        <div class="login-editorial__form">
          <div class="field">
            <label class="field__label" for="login-user">Usuario</label>
            <input id="login-user" class="field__input" type="text" value="empleado" autocomplete="username" />
          </div>
          <div class="field">
            <label class="field__label" for="login-pin">PIN</label>
            <input id="login-pin" class="field__input" type="password" inputmode="numeric" value="0000" autocomplete="current-password" />
          </div>
          <p id="login-msg" class="login-form__error" style="display:none"></p>
          <button type="button" id="btn-login" class="btn btn--primary btn--block">Entrar</button>
        </div>
      </div>
    </section>
    <section class="login-editorial__visual" aria-hidden="true">
      <img
        class="login-editorial__photo"
        src="/images/hero-bakery.jpg"
        alt=""
      />
      <div class="login-editorial__veil">
        <p class="login-editorial__eyebrow">Desde el horno</p>
        <h1 class="login-editorial__display">Panadería Lela</h1>
        <p class="login-editorial__lede">El sabor de cada día, listo para servir.</p>
      </div>
    </section>
  </div>

  <div id="view-app" class="app-shell is-hidden" style="display:none">
    <header class="app-masthead">
      <div class="app-masthead__brand">
        <svg class="brand-mark brand-mark--mast" width="28" height="28" viewBox="0 0 40 48" fill="none" aria-hidden="true">
          <g fill="currentColor">
            <rect x="18.25" y="20" width="3.5" height="26" rx="0.5"></rect>
            <path d="M20 2.5 L16.5 11.5 L20 10 L23.5 11.5 Z"></path>
            <path d="M18.5 11.5 C12 9.5 8.5 13.5 10.5 17.5 C14.5 19 18.5 16.5 18.5 11.5 Z"></path>
            <path d="M21.5 11.5 C28 9.5 31.5 13.5 29.5 17.5 C25.5 19 21.5 16.5 21.5 11.5 Z"></path>
            <path d="M18.5 17 C11.5 15.5 7.5 20 10 24.5 C14.5 26 18.5 22.5 18.5 17 Z"></path>
            <path d="M21.5 17 C28.5 15.5 32.5 20 30 24.5 C25.5 26 21.5 22.5 21.5 17 Z"></path>
            <path d="M18.5 23 C12 22 8 26.5 11 31 C15.5 32 18.5 28 18.5 23 Z"></path>
            <path d="M21.5 23 C28 22 32 26.5 29 31 C24.5 32 21.5 28 21.5 23 Z"></path>
            <path d="M18.5 29.5 C13 29 10 33 12.5 36.5 C16 37 18.5 34 18.5 29.5 Z"></path>
            <path d="M21.5 29.5 C27 29 30 33 27.5 36.5 C24 37 21.5 34 21.5 29.5 Z"></path>
          </g>
        </svg>
        <div>
          <strong class="app-masthead__name">Lela</strong>
          <span id="user-label" class="app-masthead__user"></span>
        </div>
      </div>
      <button type="button" id="btn-logout" class="app-masthead__logout">Salir</button>
    </header>

    <div class="app-shell__body">
      <div id="sub-nav" class="subtabs" style="display:none"></div>
      <main id="main" class="main page page--editorial"></main>
    </div>

    <nav id="main-nav" class="app-tabbar" aria-label="Secciones"></nav>
  </div>

  <div id="drawer" class="drawer" style="display:none" aria-hidden="true">
    <div class="drawer__scrim" id="drawer-scrim"></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true">
      <header class="drawer__head">
        <h2 id="drawer-title" class="drawer__title">Editar</h2>
        <button type="button" id="drawer-close" class="drawer__close">Cerrar</button>
      </header>
      <div id="drawer-body" class="drawer__body"></div>
      <footer id="drawer-foot" class="drawer__foot"></footer>
    </aside>
  </div>

  <input id="file-pick" class="visually-hidden" type="file" accept="image/*" />

  <script src="/lite/js/core.js?v=38"></script>
  <script src="/lite/js/screens-ops.js?v=38"></script>
  <!-- app.js antes que admin: si admin falla, el login igual arranca -->
  <script src="/lite/js/app.js?v=38"></script>
  <script src="/lite/js/screens-admin.js?v=38"></script>
</body>
</html>
